<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1116">
  <title>Predicción Equipo Basket Trewhela's 🏀</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- Splash -->
<div id="splash">
  <div class="logo">🏀</div>
  <h1>Predicción Basket Trewhela's</h1>
  <p>Pronostica el partido</p>
  <div class="spinner"></div>
</div>

<!-- Login: solo nombre -->
<div id="login-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="emoji">🏀</span>
      <h1>Basket Trewhela's</h1>
      <p>Ingresa tu nombre para predecir</p>
    </div>
    <div class="form-group">
      <label>Tu nombre</label>
      <input type="text" id="login-name" placeholder="Ej: Pablo" autocomplete="name" autofocus>
    </div>
    <button class="btn-primary" id="btn-login" onclick="doLogin()">Entrar</button>
    <div id="login-error" class="auth-error"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <header class="header">
    <div class="header-brand"><span>🏀</span>Basket Trewhela's</div>
    <div class="header-actions">
      <span class="header-user" id="header-user-name"></span>
      <button class="btn-logout" id="btn-logout">Salir</button>
    </div>
  </header>

  <nav class="tabs-nav">
    <button class="tab-btn active" data-view="predecir">🎯 Predecir</button>
    <button class="tab-btn" data-view="ranking">🏅 Ranking</button>
    <button class="tab-btn hidden" data-view="admin" id="tab-admin">⚙️ Admin</button>
  </nav>

  <section id="view-predecir" class="view active"></section>
  <section id="view-ranking" class="view"></section>
  <section id="view-admin" class="view"></section>
</div>

<div id="toast" class="toast"></div>

<script src="js/config.js?v=2"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
