<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1116">
  <title>Predicción Equipo Basket Trewhela's 🏀</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- Splash -->
<div id="splash">
  <div class="logo">🏀</div>
  <h1>Predicción Basket Trewhela's</h1>
  <p>Pronostica el partido</p>
  <div class="spinner"></div>
</div>

<!-- Setup -->
<div id="setup-page">
  <div class="setup-card">
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:48px">⚙️</div>
      <h2 style="font-size:20px;font-weight:800;margin-top:8px">Configuración inicial</h2>
      <p class="text-muted" style="margin-top:4px">Falta conectar Supabase</p>
    </div>
    <p class="text-muted">Edita <code>js/config.js</code> con tu URL y anon key de Supabase. Ver README.md</p>
  </div>
</div>

<!-- Auth -->
<div id="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="emoji">🏀</span>
      <h1>Predicción Equipo Basket Trewhela's</h1>
      <p>Pronostica el partido</p>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Iniciar sesión</button>
      <button class="auth-tab" data-tab="register">Registrarse</button>
    </div>
    <div id="register-extra" style="display:none">
      <div class="form-group">
        <label>Tu nombre</label>
        <input type="text" id="auth-name" placeholder="Ej: Pablo" autocomplete="name">
      </div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="auth-email" placeholder="tu@email.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="btn-auth">Iniciar sesión</button>
    <div id="auth-error" class="auth-error"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <header class="header">
    <div class="header-brand"><span>🏀</span>Basket Trewhela's</div>
    <div class="header-actions">
      <span class="header-user" id="header-user-name"></span>
      <button class="btn-logout" id="btn-logout">Salir</button>
    </div>
  </header>

  <nav class="tabs-nav">
    <button class="tab-btn active" data-view="predecir">🎯 Predecir</button>
    <button class="tab-btn" data-view="ranking">🏅 Ranking</button>
    <button class="tab-btn hidden" data-view="admin" id="tab-admin">⚙️ Admin</button>
  </nav>

  <section id="view-predecir" class="view active"></section>
  <section id="view-ranking" class="view"></section>
  <section id="view-admin" class="view"></section>
</div>

<div id="toast" class="toast"></div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
